# ──────────────────────────────────────────────────────────────────────────────
# LOCAL DEVELOPMENT ONLY.
#
# Production is deployed as three *separate* Coolify applications (one per
# domain) built from the per-app Dockerfiles — see DEPLOYMENT.md. Coolify does
# not use this file; it exists so you can run the whole stack locally with:
#
#   docker compose up --build
#
#   storefront -> http://localhost:3000
#   admin      -> http://localhost:3001
#   api        -> http://localhost:5000/api/health
# ──────────────────────────────────────────────────────────────────────────────
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: localpass
      POSTGRES_DB: ambrosia_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: postgres://postgres:localpass@postgres:5432/ambrosia_db
      # Empty: the local/Coolify Postgres serves no TLS.
      DB_SSL: ""
      JWT_SECRET: local_dev_secret_change_me
      ALLOWED_ORIGINS: http://localhost:3000,http://localhost:3001
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:-}
      R2_BUCKET_NAME: ${R2_BUCKET_NAME:-ambrosia}
      R2_PUBLIC_URL: ${R2_PUBLIC_URL:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        # Build-time, not runtime: NEXT_PUBLIC_* is inlined into the bundle.
        NEXT_PUBLIC_API_URL: http://localhost:5000/api/v1
        NEXT_PUBLIC_R2_PUBLIC_URL: https://pub-8204a887dc104db5bc9768e902671861.r2.dev
    ports:
      - "3000:3000"
    depends_on:
      - backend

  admin:
    build:
      context: ./admin
      args:
        NEXT_PUBLIC_API_URL: http://localhost:5000/api/v1
        NEXT_PUBLIC_R2_PUBLIC_URL: https://pub-8204a887dc104db5bc9768e902671861.r2.dev
    ports:
      - "3001:3001"
    depends_on:
      - backend

volumes:
  pgdata:
